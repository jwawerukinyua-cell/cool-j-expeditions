    <!-- Dynamic Domain & Social Card Origin Synchronizer -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          if (origin && !origin.includes('file://')) {
            // Sync canonical URL with live host
            var canonicalEl = document.querySelector('link[rel="canonical"]');
            if (canonicalEl) {
              canonicalEl.setAttribute('href', origin + window.location.pathname);
            }
            // Sync og:url
            var ogUrlEl = document.querySelector('meta[property="og:url"]');
            if (ogUrlEl) {
              ogUrlEl.setAttribute('content', origin + window.location.pathname);
            }
            // If running on a preview or connected custom domain, resolve absolute image URLs
            var ogImgEl = document.querySelector('meta[property="og:image"]');
            if (ogImgEl && !ogImgEl.getAttribute('content').startsWith('http')) {
              ogImgEl.setAttribute('content', origin + '/cool-j-logo.jpg');
            }
            var twImgEl = document.querySelector('meta[name="twitter:image"]');
            if (twImgEl && !twImgEl.getAttribute('content').startsWith('http')) {
              twImgEl.setAttribute('content', origin + '/cool-j-logo.jpg');
            }
          }
        } catch (e) {
          // Graceful fallback to static tags
        }
      })();
    </script>
